change: PR #37. CI provenance check (tests need the oracle trailer), a PreToolUse guard hook, and a per-PR verification ledger with cost per check
fixtures:
  scripts/fixtures/oracle/commits.json: real commits 715de4c 91fe627 46ed249 8ea54ee bd58a69 8b1b6ff 5b31962 (files diffed against the first parent), captured because CI on main clones at depth 1
  scripts/fixtures/oracle/check-runs.json: real gh api check runs per commit for PRs 24, 27, 33, 35 in jasontd92/golden-hour
  scripts/fixtures/oracle/pr-checks-27.json: real gh pr checks 27 --json name,bucket (all pass or skipping)
  scripts/fixtures/oracle/pr-checks-35.json: real gh pr checks 35 --json name,bucket while it was running (fail, cancel, pending)
claims:
  - claim: origin/main..origin/ws12-stryker has exactly the 4 known violations, one per (commit, test file)
    kind: empirical
    check: scripts/provenance.spec.ts > finds exactly the 4 known violations
    rules_out: one problem per commit (gives 3) or deduping by file (gives 2)
  - claim: deleting a test counts as changing it
    kind: empirical
    check: scripts/provenance.spec.ts > counts a deleted test (46ed249)
    rules_out: a diff filter that looks only at added or modified files, so an implementer can delete the tests that judge them
  - claim: merge commits are exempt even when they bring in test files
    kind: empirical
    check: scripts/provenance.spec.ts > exempts merge commits (8ea54ee, bd58a69); exempts a merge with any number of parents ≥ 2 but not a root commit
    rules_out: treating merges like ordinary commits (every main merge would fail), or parents <= 1 / === 1 boundary bugs
  - claim: the trailer must be the exact line 'Verified-by: oracle'; quoting it mid-line does not count
    kind: empirical
    check: scripts/provenance.spec.ts > does not accept the trailer text quoted mid-line (8b1b6ff's real message); rejects lowercase key / other verifier / longer value / negated / in the subject sentence / no space
    rules_out: message.includes(trailer), a case-insensitive match, a prefix match
  - claim: each commit needs its own trailer
    kind: mechanical
    check: scripts/provenance.spec.ts > judges each commit on its own trailer
    rules_out: "any commit in the range has the trailer" (an oracle commit would cover a later implementer commit that weakens the tests)
  - claim: test paths are *.spec.ts and *.e2e.ts at any depth, plus verification.yaml; *.local.spec.ts never is
    kind: mechanical
    check: scripts/provenance.spec.ts > which paths are tests (both it.each tables)
    rules_out: a glob that misses root-level or deeply nested specs, a missing *.e2e.ts or verification.yaml, or flagging *.local.spec.ts
  - claim: the provenance CLI takes a git range and exits 1 with one line per problem (naming commit and file), or exits 0 on a clean range
    kind: empirical
    check: scripts/provenance.spec.ts > provenance CLI (temporary repo with a real implementer message, an oracle commit, a local spec, a merge of main, a deletion and a verification.yaml edit)
    rules_out: exit 0 on problems, reporting merges, oracle commits or local specs, or failing every range
  - claim: judgeCommit blocks staged test paths unless ROLE is exactly 'oracle', and names the files in the reason
    kind: mechanical
    check: scripts/hooks/guard.spec.ts > judgeCommit (blocks staging / treats ROLE=… as not the oracle / allows the oracle / allows no test paths)
    rules_out: a truthy or case-insensitive role check, missing a test kind, blocking every commit
  - claim: judgeCommit blocks the trailer text outside ROLE=oracle even with no tests staged
    kind: mechanical
    check: scripts/hooks/guard.spec.ts > blocks the trailer text outside the oracle even when no tests are staged
    rules_out: checking the trailer only when tests are staged, so an implementer can forge provenance for a later commit
  - claim: judgeMerge allows only when every check's bucket is pass or skipping, and blocks when no checks are reported
    kind: empirical
    check: scripts/hooks/guard.spec.ts > judgeMerge (real PR #27 allowed, real PR #35 blocked naming checks/evidence/e2e, single fail/pending/cancel/neutral/'' blocks, empty list blocks)
    rules_out: "no failures" instead of "all green" (pending or cancelled would merge), skipping treated as red, vacuous truth on []
  - claim: the hook reads stdin JSON (cwd, tool_input.command), exits 2 with the reason on stderr to block and 0 to allow, handles git commit -a, and asks gh about the PR named in gh pr merge
    kind: empirical
    check: scripts/hooks/guard.spec.ts > guard hook (temporary repo for commits; a stand-in gh on PATH serving the real PR #27/#35 checks)
    rules_out: exit 1 (which Claude Code does not treat as a block), reading only the index under -a, ignoring cwd, checking the wrong PR
  - claim: programmaticCatches gives one catch per (check, commit) for a check that failed on a non-last commit and succeeded on the last, with real null
    kind: empirical
    check: scripts/ledger.spec.ts > programmaticCatches (real PR #24 gives evidence@95ca93e; #27/#33/#35 give none; synthetic cases for last-commit success, dedup, re-run on last commit, cancelled/skipped, run order)
    rules_out: counting failures on the last commit, "passed on any later commit", one catch per run or per check, treating cancelled as failure, sorting shas to find the last commit, pre-classifying real
  - claim: programmaticCosts gives per check the runs and minutes rounded up per run, with skipped runs excluded
    kind: empirical
    check: scripts/ledger.spec.ts > programmaticCosts (real PR #27 per-check totals; PR #24 failed run counted; 1.01 rounds to 2)
    rules_out: Math.ceil of the summed minutes (checks would give 6 not 8), counting skipped runs (evidence/e2e would give 4 runs), Math.round, costing only successes
  - claim: summarize gives per check the real/flake/unclassified counts and summed runs, minutes and tokens, ordered by real catches
    kind: mechanical
    check: scripts/ledger.spec.ts > summarize
    rules_out: last entry wins, dropping checks that have costs but no catches (they are the ones to remove), ordering by name
  - claim: mutation testing of the three scripts against these tests leaves no meaningful covered survivor
    kind: mechanical
    check: pnpm exec stryker run --mutate scripts/provenance.ts,scripts/hooks/guard.ts,scripts/ledger.ts --incrementalFile reports/oracle-tmp.json. Covered survivors are only message text, output sort order, the short-sha length and line.trim(). The CLI blocks show as no coverage because they run in a subprocess, but they are tested there.
    rules_out: tests that would pass on a plausible wrong implementation
  - claim: whether a trailer line with surrounding whitespace ('Verified-by: oracle  ', or a CRLF line) should count; the implementation trims and accepts it
    kind: judgment
    check: none, left for the human
    rules_out: n/a
  - claim: whether a nested verification.yaml (not at the repo root) or a timed_out or startup_failure conclusion should count; the brief is silent
    kind: judgment
    check: none, left for the human
    rules_out: n/a
  - claim: whether the guard's command regexes catch every way to commit or merge (git -C dir commit, aliases, gh api merges, a commit run by a script); CI provenance is the backstop
    kind: judgment
    check: none, left for the human
    rules_out: n/a
