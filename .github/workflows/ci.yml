name: ci

on:
  pull_request:
    paths-ignore: &docs-only
      - '.sprint/**'
      - 'team/**'
      - 'profiles/**'
      - 'prompts/**'
      - 'README.md'
      - 'data/README.md'
  push:
    branches: [main]
    paths-ignore: *docs-only

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      e2e: ${{ steps.e2e-scope.outputs.specs }}
    steps:
      - uses: actions/checkout@v7
      - id: setup
        uses: ./.github/actions/setup
      - name: typecheck
        run: pnpm typecheck
      - name: lint
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm lint
      - name: policy
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm policy
      - name: normalized data matches a fresh build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm data:build && git diff --exit-code data/normalized
      - name: plan matches a fresh generate
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm plan:generate && git diff --exit-code plan
      - name: unit
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm test:unit
      - id: e2e-scope
        name: e2e specs for what this PR renders
        if: ${{ github.event_name == 'pull_request' && steps.setup.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          all=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq '.[].name' | grep -qx screenshots && echo --all || true)
          specs=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename' | node scripts/e2e-scope.ts $all)
          echo "specs=$specs" >> "$GITHUB_OUTPUT"
          echo "e2e: ${specs:-skipped until merge}"

  bundle-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm build
      - run: node scripts/budgets.ts

  e2e:
    needs: checks
    if: ${{ !cancelled() && (github.event_name == 'push' || needs.checks.outputs.e2e != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact-id: ${{ steps.screenshots.outputs.artifact-id }}
      artifact-url: ${{ steps.screenshots.outputs.artifact-url }}
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          setup-node: 'false'
      - run: pnpm test:e2e $SPECS
        env:
          HOME: /root
          SPECS: ${{ needs.checks.outputs.e2e != 'all' && needs.checks.outputs.e2e || '' }}
      - id: screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: test-results/screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7

  evidence:
    needs: e2e
    if: always() && github.event_name == 'pull_request' && needs.e2e.outputs.artifact-id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      SHA: ${{ github.event.pull_request.head.sha }}
      ARTIFACT_URL: ${{ needs.e2e.outputs.artifact-url }}
      E2E_RESULT: ${{ needs.e2e.result }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: e2e-screenshots
          path: shots
      - name: Publish screenshots to ci-evidence
        run: |
          dir="$PR/$SHA"
          git init -q evidence && cd evidence
          git remote add origin "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git"
          if git fetch -q origin ci-evidence; then
            git checkout -q -b ci-evidence FETCH_HEAD
          else
            git checkout -q --orphan ci-evidence
            echo '{"git":{"deploymentEnabled":false}}' > vercel.json
          fi
          mkdir -p "$dir"
          cp ../shots/*.png "$dir"/
          git add -A .
          git diff --cached --quiet || git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit -qm "ci: e2e evidence for #$PR at ${SHA:0:7}"
          for attempt in 1 2 3; do
            git push -q origin HEAD:ci-evidence && exit 0
            git fetch -q origin ci-evidence && git rebase -q FETCH_HEAD
          done
          exit 1
      - name: Comment with inline screenshots
        run: |
          base="https://github.com/$GITHUB_REPOSITORY/blob/ci-evidence/$PR/$SHA"
          {
            echo "<!-- e2e-screenshots -->"
            echo "**E2E evidence** for \`${SHA:0:7}\` (e2e: $E2E_RESULT). [Zip]($ARTIFACT_URL)"
            echo
            for file in shots/*.png; do
              name=$(basename "$file" .png)
              echo "**$name**"
              echo
              echo "<img src=\"$base/$name.png?raw=true\" width=\"320\" alt=\"$name\">"
              echo
            done
          } > body.md
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- e2e-screenshots -->"))][0].id // empty')
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@body.md >/dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@body.md >/dev/null
          fi
