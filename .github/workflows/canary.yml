name: canary

on:
  status:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/canary.yml
      - scripts/canary.ts

permissions:
  contents: read

jobs:
  production:
    if: github.event_name != 'status' || (github.event.context == 'Vercel' && github.event.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: node scripts/canary.ts
