name: mutation

on:
  pull_request:
    paths: &mutated
      - src/lib/domain/**
      - src/lib/server/db/**
      - src/lib/features/log/store.ts
      - src/lib/features/log/store.spec.ts
      - src/lib/features/log/sync.ts
      - src/lib/features/log/sync.spec.ts
      - scripts/csv.ts
      - scripts/csv.spec.ts
      - scripts/python-json.ts
      - scripts/python-json.spec.ts
      - stryker.config.json
      - scripts/mutation-scope.ts
      - .github/workflows/mutation.yml
  push:
    branches: [main]
    paths: *mutated
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - id: baseline
        uses: actions/cache/restore@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-
      - name: Mutation test (incremental)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && steps.baseline.outputs.cache-matched-key != '')
        timeout-minutes: ${{ github.event_name == 'pull_request' && 20 || 110 }}
        run: pnpm mutate
      - name: Mutation test (changed files only, no baseline yet)
        if: github.event_name == 'pull_request' && steps.baseline.outputs.cache-matched-key == ''
        timeout-minutes: 20
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files=$(git diff --name-only "$BASE"...HEAD | node scripts/mutation-scope.ts)
          echo "No main-branch baseline cached yet; mutating only: ${files:-nothing}" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$files" ] || exit 0
          mkdir -p reports
          jq '.incremental = false | .thresholds.break = null' stryker.config.json > reports/stryker-changed.json
          pnpm mutate reports/stryker-changed.json --mutate "$files"
      - name: Mutation test (full)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm mutate --force
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/mutation.html
          if-no-files-found: ignore
          retention-days: 14
