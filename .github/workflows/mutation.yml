name: mutation

on:
  pull_request:
    paths: &mutated
      - src/lib/domain/**
      - src/lib/server/db/**
      - src/lib/features/log/store.ts
      - src/lib/features/log/store.spec.ts
      - src/lib/features/log/sync.ts
      - src/lib/features/log/sync.spec.ts
      - scripts/csv.ts
      - scripts/csv.spec.ts
      - scripts/python-json.ts
      - scripts/python-json.spec.ts
      - stryker.config.json
      - .github/workflows/mutation.yml
  push:
    branches: [main]
    paths: *mutated
  schedule:
    - cron: '23 9 * * 1'
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/cache/restore@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-
      - name: Mutation test (incremental)
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: pnpm mutate
      - name: Mutation test (full)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: pnpm mutate --force
      - if: always()
        uses: actions/cache/save@v6
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}-${{ github.run_id }}
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-report
          path: reports/mutation/mutation.html
          if-no-files-found: ignore
          retention-days: 14
