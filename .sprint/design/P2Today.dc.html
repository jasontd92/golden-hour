<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
.press{transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1); -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none}
.press:active{transform: scale(0.97)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: {{c.bg}}; color: {{c.text}}; font-family: Geist, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; position: relative; overflow: hidden">
<header style="padding: 64px 24px 28px; display: flex; flex-direction: column; gap: 6px">
<div style="font-size: 15px; color: {{c.muted}}">Monday</div>
<h1 style="margin: 0; font-size: 34px; line-height: 1.08; letter-spacing: -0.02em; font-weight: 650">Squat + short sprint</h1>
<div style="font-size: 15px; color: {{c.muted}}">50 min</div>
</header>
<main style="flex: 1; padding: 0 16px; display: flex; flex-direction: column">
<sc-for list="{{blocks}}" as="b" hint-placeholder-count="4">
<div style="border-top: 1px solid {{c.line}}">
<button type="button" class="press" onClick="{{b.toggle}}" aria-expanded="{{b.open}}" style="width: 100%; min-height: 60px; padding: 0 8px; display: flex; align-items: center; gap: 10px; background: transparent; border: 0; color: {{c.text}}; font: inherit; font-size: 17px; text-align: left">
<span style="flex: 1">{{b.name}}</span>
<sc-if value="{{b.hard}}" hint-placeholder-val="{{false}}"><span aria-label="Hard effort" style="width: 8px; height: 8px; border-radius: 50%; background: {{c.accent}}"></span></sc-if>
<span style="color: {{c.muted}}; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 14px">{{b.min}}</span>
</button>
<sc-if value="{{b.open}}" hint-placeholder-val="{{false}}">
<div style="padding: 0 8px 18px; display: flex; flex-direction: column; gap: 6px">
<sc-for list="{{b.lines}}" as="l" hint-placeholder-count="3">
<div style="font-size: 17px; line-height: 1.4; color: {{l.color}}; font-weight: {{l.weight}}">{{l.text}}</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
<div style="border-top: 1px solid {{c.line}}"></div>
<button type="button" class="press" onClick="{{toggleWhy}}" style="align-self: flex-start; margin-top: 14px; min-height: 44px; padding: 0 8px; background: transparent; border: 0; color: {{c.muted}}; font: inherit; font-size: 15px">{{whyLabel}}</button>
<sc-if value="{{whyOpen}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; padding: 0 8px; font-size: 15px; line-height: 1.5; color: {{c.muted}}; max-width: 34ch">Your top squat set resets the training max for this cycle. The AMRAP is the first of three hard efforts this week, so keep it short and fast.</p>
</sc-if>
</main>
<div style="padding: 12px 16px 12px">
<a href="P2Log.dc.html" class="press" style="display: flex; align-items: center; justify-content: center; min-height: 56px; border-radius: 16px; background: {{c.button}}; color: {{c.buttonText}}; font-weight: 600; font-size: 17px; text-decoration: none">Start</a>
</div>
<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px 8px 30px; background: {{c.bar}}; backdrop-filter: blur(20px) saturate(180%)">
<a href="P2Today.dc.html" aria-current="page" class="press" style="display: flex; align-items: center; justify-content: center; min-height: 48px; color: {{c.text}}; font-size: 13px; font-weight: 600; text-decoration: none">Today</a>
<a href="P2Week.dc.html" class="press" style="display: flex; align-items: center; justify-content: center; min-height: 48px; color: {{c.muted}}; font-size: 13px; text-decoration: none">Week</a>
<a href="P2Progress.dc.html" class="press" style="display: flex; align-items: center; justify-content: center; min-height: 48px; color: {{c.muted}}; font-size: 13px; text-decoration: none">Progress</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: null, why: false };
  }
  renderVals() {
    const dark = (this.props.theme ?? 'dark') === 'dark';
    const c = dark
      ? { bg: '#06090b', text: '#eef4f3', muted: '#93a3a1', line: '#ffffff1a', accent: '#2fd8c6', button: '#2fd8c6', buttonText: '#06090b', bar: 'rgba(6,9,11,0.72)' }
      : { bg: '#FAFAF8', text: '#161817', muted: '#636865', line: '#E6E6E1', accent: '#E0650F', button: '#161817', buttonText: '#FAFAF8', bar: 'rgba(250,250,248,0.72)' };
    const plain = (t) => ({ text: t, color: c.text, weight: 400 });
    const quiet = (t) => ({ text: t, color: c.muted, weight: 400 });
    const strong = (t) => ({ text: t, color: c.text, weight: 600 });
    const defs = [
      { id: 'warm', name: 'Warm-up', min: '8', lines: [plain('2 rounds'), quiet('200 m jog · 10 air squats · 10 pass-throughs · 5 inchworms')] },
      { id: 'squat', name: 'Back squat', min: '22', lines: [plain('170 × 5'), plain('200 × 5'), strong('225 × 5+'), quiet('Then 5 × 5 at 170 with strict pull-ups 5 × 6')] },
      { id: 'amrap', name: 'AMRAP 12', min: '14', hard: true, lines: [plain('8 DB snatches, 45 lb'), plain('10 box jumps, 24"'), plain('200 m run'), quiet('Aim for 5+ rounds')] },
      { id: 'cool', name: 'Cool-down', min: '6', lines: [quiet('Couch stretch · dead hang')] },
    ];
    const blocks = defs.map((d) => ({
      ...d,
      hard: !!d.hard,
      open: this.state.open === d.id,
      toggle: () => this.setState({ open: this.state.open === d.id ? null : d.id }),
    }));
    return {
      c,
      blocks,
      whyOpen: this.state.why,
      whyLabel: this.state.why ? 'Hide why' : 'Why this session',
      toggleWhy: () => this.setState({ why: !this.state.why }),
    };
  }
}
</script>
</body>
</html>
