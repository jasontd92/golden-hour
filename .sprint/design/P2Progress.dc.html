<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
.press{transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1); -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none}
.press:active{transform: scale(0.98)}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #06090b; color: #eef4f3; font-family: Geist, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">
<header style="padding: 64px 24px 20px">
<h1 style="margin: 0; font-size: 34px; line-height: 1.08; letter-spacing: -0.02em; font-weight: 650">Progress</h1>
</header>
<main style="flex: 1; padding: 0 16px; display: flex; flex-direction: column; gap: 28px">
<section style="display: flex; flex-direction: column">
<h2 style="margin: 0 8px 8px; font-size: 15px; font-weight: 400; color: #93a3a1">Benchmarks</h2>
<sc-for list="{{benchmarks}}" as="r" hint-placeholder-count="5">
<button type="button" class="press" style="display: flex; align-items: baseline; gap: 10px; min-height: 52px; padding: 0 8px; background: transparent; border: 0; border-top: 1px solid #ffffff1a; color: #eef4f3; font: inherit; text-align: left">
<span style="flex: 1; font-size: 17px">{{r.name}}</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 16px; font-weight: 500">{{r.best}}</span>
</button>
</sc-for>
</section>
<section style="display: flex; flex-direction: column">
<h2 style="margin: 0 8px 8px; font-size: 15px; font-weight: 400; color: #93a3a1">Lifts · 1 rep max</h2>
<sc-for list="{{lifts}}" as="r" hint-placeholder-count="3">
<button type="button" class="press" style="display: flex; align-items: baseline; gap: 10px; min-height: 52px; padding: 0 8px; background: transparent; border: 0; border-top: 1px solid #ffffff1a; color: #eef4f3; font: inherit; text-align: left">
<span style="flex: 1; font-size: 17px">{{r.name}}</span><span style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 16px; font-weight: 500">{{r.best}}</span>
</button>
</sc-for>
</section>
</main>
<nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); padding: 4px 8px 30px; background: rgba(6,9,11,0.72); backdrop-filter: blur(20px) saturate(180%)">
<a href="P2Today.dc.html" class="press" style="display: flex; align-items: center; justify-content: center; min-height: 48px; color: #93a3a1; font-size: 13px; text-decoration: none">Today</a>
<a href="P2Week.dc.html" class="press" style="display: flex; align-items: center; justify-content: center; min-height: 48px; color: #93a3a1; font-size: 13px; text-decoration: none">Week</a>
<a href="P2Progress.dc.html" aria-current="page" class="press" style="display: flex; align-items: center; justify-content: center; min-height: 48px; color: #eef4f3; font-size: 13px; font-weight: 600; text-decoration: none">Progress</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      benchmarks: [
        { name: 'Turkey Trot Triple', best: '46:18' },
        { name: 'Cunningham', best: '36:40' },
        { name: 'CrossFit Total', best: '845' },
        { name: 'Fran', best: '4:43' },
        { name: '5k run', best: '22:50' },
        { name: 'Strict pull-ups', best: '13' },
      ],
      lifts: [
        { name: 'Deadlift', best: '365' },
        { name: 'Back squat', best: '295' },
        { name: 'Press', best: '165' },
      ],
    };
  }
}
</script>
</body>
</html>
