<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Logging a set</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:inherit}
.press{transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1); -webkit-tap-highlight-color: transparent; touch-action: manipulation; user-select: none}
.press:active{transform: scale(0.97)}
.swap{transition: opacity 200ms cubic-bezier(0.23, 1, 0.32, 1), transform 200ms cubic-bezier(0.23, 1, 0.32, 1)}
@starting-style{.swap{opacity: 0; transform: translateY(6px)}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #06090b; color: #eef4f3; font-family: Geist, -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; font-variant-numeric: tabular-nums">
<header style="padding: 54px 8px 0; display: flex; align-items: center; justify-content: space-between">
<a href="P2Today.dc.html" class="press" aria-label="Back to today" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #eef4f3"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 18l-6-6 6-6"></path></svg></a>
<span style="font-size: 15px; color: #93a3a1">Back squat · 3 of 3</span>
<span style="width: 44px"></span>
</header>
<main style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px; padding: 0 24px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 80px; line-height: 1; font-weight: 650; letter-spacing: -0.03em">225</div>
<div style="font-size: 17px; color: #93a3a1">lb · 5 or more reps</div>
</div>
<sc-if value="{{editing}}" hint-placeholder-val="{{true}}">
<div class="swap" style="display: flex; align-items: center; gap: 28px">
<button type="button" class="press" onClick="{{less}}" aria-label="One fewer rep" style="width: 64px; height: 64px; border-radius: 50%; background: #ffffff0d; border: 0; color: #eef4f3; font-size: 30px">−</button>
<div style="display: flex; flex-direction: column; align-items: center; min-width: 72px"><span aria-live="polite" style="font-family: 'Geist Mono', ui-monospace, monospace; font-size: 44px; font-weight: 600">{{reps}}</span><span style="font-size: 13px; color: #93a3a1">reps</span></div>
<button type="button" class="press" onClick="{{more}}" aria-label="One more rep" style="width: 64px; height: 64px; border-radius: 50%; background: #ffffff0d; border: 0; color: #eef4f3; font-size: 30px">+</button>
</div>
</sc-if>
<sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
<div class="swap" style="display: flex; flex-direction: column; align-items: center; gap: 6px">
<div style="font-size: 17px; font-weight: 600">{{reps}} reps saved</div>
<div style="font-size: 15px; color: #93a3a1">Estimated max {{est}} lb</div>
<div style="margin-top: 18px; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 36px; font-weight: 600; color: #2fd8c6">1:30</div>
<div style="font-size: 13px; color: #93a3a1">rest</div>
</div>
</sc-if>
</main>
<div style="padding: 0 16px 40px; display: flex; flex-direction: column; gap: 8px">
<button type="button" class="press" onClick="{{primary}}" style="min-height: 56px; border-radius: 16px; background: #2fd8c6; border: 0; color: #06090b; font: inherit; font-weight: 600; font-size: 17px">{{primaryLabel}}</button>
<button type="button" class="press" onClick="{{secondary}}" style="min-height: 44px; background: transparent; border: 0; color: #93a3a1; font: inherit; font-size: 15px">{{secondaryLabel}}</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { reps: 5, saved: false };
  }
  renderVals() {
    const { reps, saved } = this.state;
    const est = Math.round(225 * reps * 0.0333 + 225);
    return {
      reps,
      est,
      saved,
      editing: !saved,
      less: () => this.setState({ reps: Math.max(0, reps - 1) }),
      more: () => this.setState({ reps: reps + 1 }),
      primary: () => this.setState({ saved: !saved }),
      primaryLabel: saved ? 'Next: 5 × 5 at 170' : 'Done',
      secondary: () => saved && this.setState({ saved: false }),
      secondaryLabel: saved ? 'Undo' : 'Add a note',
    };
  }
}
</script>
</body>
</html>
