<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Week planner</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
sc-for, sc-if{display: contents}
a{color:inherit}
button{font:inherit}
.press{transition: transform 140ms cubic-bezier(0.23, 1, 0.32, 1); user-select: none}
.press:active{transform: scale(0.97)}
.row{position: relative; isolation: isolate}
.row::before{content: ''; position: absolute; inset: 0 -8px; z-index: -1; border-radius: 16px; background: #ffffff0d; opacity: 0; transition: opacity 100ms ease}
.quiet-btn{transition: color 100ms ease}
:focus-visible{outline: 2px solid #2fd8c6; outline-offset: 3px}
@media (hover: hover) and (pointer: fine){
  .row:hover::before{opacity: 1}
  .quiet-btn:hover{color: #eef4f3}
}
@media (prefers-reduced-motion: reduce){
  .press, .row::before, .quiet-btn{transition: none}
  .press:active{transform: none}
}
.mono{font-family: 'Geist Mono', ui-monospace, monospace}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #06090b; color: #eef4f3; font-family: Geist, -apple-system, system-ui, sans-serif; font-variant-numeric: tabular-nums; display: flex; flex-direction: column; overflow: hidden">

<nav aria-label="Main" style="height: 56px; flex: none; padding: 0 48px; display: flex; align-items: center; gap: 28px; font-size: 15px">
<a href="P3Week.dc.html" aria-current="page" style="text-decoration: none; font-weight: 600">Plan</a>
<a href="P3Progress.dc.html" class="quiet-btn" style="text-decoration: none; color: #93a3a1">Progress</a>
</nav>

<div style="flex: 1; min-height: 0; padding: 0 48px 36px; display: flex; flex-direction: column">
<header style="padding: 20px 0 24px; display: flex; align-items: flex-end; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px">
<div style="font-size: 15px; color: #93a3a1">Jan 11 – 16 · Leader · 75/85/95% × 5</div>
<h1 style="margin: 0; font-size: 34px; line-height: 1.08; letter-spacing: -0.02em; font-weight: 650">Week 6 <span style="color: #93a3a1; font-weight: 600">of 17</span></h1>
</div>
<div style="display: flex; gap: 4px; padding-bottom: 2px">
<button type="button" class="quiet-btn press" aria-label="Previous week" style="width: 40px; height: 40px; border: 0; border-radius: 16px; background: transparent; color: #93a3a1; font-size: 20px; cursor: pointer">‹</button>
<button type="button" class="quiet-btn press" aria-label="Next week" style="width: 40px; height: 40px; border: 0; border-radius: 16px; background: transparent; color: #93a3a1; font-size: 20px; cursor: pointer">›</button>
</div>
</header>

<div aria-label="Evolution 5, 17 weeks" style="display: grid; grid-template-columns: repeat(17, minmax(0, 1fr)); gap: 4px">
<sc-for list="{{strip}}" as="s" hint-placeholder-count="17">
<button type="button" class="press" aria-label="{{s.aria}}" style="height: 24px; padding: 0; border: 0; background: transparent; display: flex; flex-direction: column; justify-content: center; cursor: pointer">
<span style="display: block; height: 6px; border-radius: 16px; background: {{s.fill}}; box-shadow: {{s.ring}}"></span>
</button>
</sc-for>
</div>
<div style="display: grid; grid-template-columns: repeat(17, minmax(0, 1fr)); gap: 4px; margin-top: 2px; font-size: 12px; color: #93a3a1">
<sc-for list="{{phases}}" as="p" hint-placeholder-count="7">
<span style="grid-column: span {{p.span}}; white-space: nowrap; overflow: hidden">{{p.name}}</span>
</sc-for>
</div>

<div style="margin-top: 32px; flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(6, minmax(0, 1fr))">
<sc-for list="{{days}}" as="d" hint-placeholder-count="6">
<section aria-label="{{d.aria}}" style="padding: 0 20px 0 {{d.padLeft}}; border-left: {{d.border}}; display: flex; flex-direction: column; min-width: 0">
<div style="font-size: 13px; color: {{d.dayColor}}; font-weight: {{d.dayWeight}}">{{d.day}} <span style="color: #93a3a1; font-weight: 400">{{d.date}}</span></div>
<h2 style="margin: 8px 0 0; min-height: 2.4em; font-size: 19px; line-height: 1.2; letter-spacing: -0.02em; font-weight: 650; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{d.title}}</h2>
<div style="margin-top: 4px; font-size: 13px; color: #93a3a1">{{d.sub}}</div>
<div style="margin-top: 20px; display: flex; flex-direction: column">
<sc-for list="{{d.blocks}}" as="b" hint-placeholder-count="4">
<div style="border-top: 1px solid #ffffff1a">
<button type="button" class="row press" onClick="{{b.toggle}}" aria-expanded="{{b.open}}" style="width: 100%; min-height: 44px; padding: 0; border: 0; display: flex; align-items: center; gap: 8px; background: transparent; color: #eef4f3; font-size: 14px; text-align: left; cursor: pointer">
<span style="flex: 1; min-width: 0">{{b.name}}</span>
<sc-if value="{{b.hard}}" hint-placeholder-val="{{false}}"><span aria-label="Hard effort" style="flex: none; width: 8px; height: 8px; border-radius: 50%; background: #2fd8c6"></span></sc-if>
<span class="mono" style="color: #93a3a1; font-size: 13px">{{b.min}}</span>
</button>
<sc-if value="{{b.open}}" hint-placeholder-val="{{false}}">
<div style="padding: 0 0 12px; display: flex; flex-direction: column; gap: 4px">
<sc-for list="{{b.lines}}" as="l" hint-placeholder-count="3">
<div style="font-size: 14px; line-height: 1.4; color: {{l.color}}">{{l.text}}</div>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
<div style="border-top: 1px solid #ffffff1a"></div>
</div>
</section>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 'Fri-1' };
  }
  renderVals() {
    const C = { text: '#eef4f3', muted: '#93a3a1', accent: '#2fd8c6', glass: '#ffffff0d', line: '#ffffff1a' };
    const P = (t) => ({ text: t, color: C.text });
    const Q = (t) => ({ text: t, color: C.muted });
    const phaseOf = (w) => w <= 6 ? 'Leader' : w === 7 || w === 15 ? 'Deload' : w === 11 ? 'TM test' : w >= 16 ? 'Retest' : 'Anchor';
    const strip = Array.from({ length: 17 }, (_, i) => {
      const w = i + 1;
      return { fill: w < 6 ? C.line : w === 6 ? C.accent : C.glass, ring: 'none', aria: `Week ${w}, ${phaseOf(w)}` };
    });
    const phases = [['Leader', 6], ['Deload', 1], ['Anchor', 3], ['TM test', 1], ['Anchor', 3], ['Deload', 1], ['Retest', 2]].map(([name, span]) => ({ name: span === 1 ? name.split(' ')[0] : name, span }));
    const defs = [
      { day: 'Mon', date: 'Jan 11', title: 'Squat + sprint intervals', status: 'Logged', blocks: [['Warm-up', 8, [P('10–15 box jumps'), Q('Air squats · pass-throughs')]], ['Back squat', 22, [P('170 × 5'), P('190 × 5'), P('215 × 5'), Q('Then 5 × 5 at 170')]], ['Sprint intervals', 10, [P('10–30 s on, rest 1:3'), Q('Run, gymnastics or weights')], true], ['Cool-down', 6, [Q('Couch stretch · dead hang')]]] },
      { day: 'Tue', date: 'Jan 12', title: 'Press + easy run', status: 'Logged', blocks: [['Warm-up', 6, [P('10 plyo push-ups')]], ['Shoulder press', 18, [P('105 × 5'), P('120 × 5'), P('135 × 5'), Q('Then 5 × 5 at 105')]], ['Gymnastics', 12, [P('L-sit · pike HSPU · ring dips')]], ['Easy run', 30, [P('25–35 min, Zone 1')]]] },
      { day: 'Wed', date: 'Jan 13', title: 'Tempo 4 × 8 min', today: true, blocks: [['Warm-up', 10, [P('Easy jog · drills · 2 strides')]], ['4 × 8 min', 40, [P('2 min jog between'), Q('P10 + 0–15 s/mi')], true], ['Pull-ups', 10, [P('Sets of 7'), Q('Fill with ring rows')]]] },
      { day: 'Thu', date: 'Jan 14', title: 'Easy flow + skill', blocks: [['Easy flow', 30, [P('Assault bike + calisthenics'), Q('RPE 4 or lower')]], ['Skill', 12, [P('Handstand holds · L-sit')]], ['Pull-up test', 3, [P('Strict, max reps')]]] },
      { day: 'Fri', date: 'Jan 15', title: 'Speed run + deadlift', blocks: [['Warm-up', 10, [P('Easy jog · drills · strides')]], ['Ladder', 25, [P('3 × 600 / 400 / 300 / 200 m'), Q('Rest 2:00 / 1:30 / 1:00 / 0:30')], true], ['Deadlift', 25, [P('220 × 5'), P('245 × 5'), P('275 × 5'), Q('Then 3 × 5 at 220')]], ['Cool-down', 5, [Q('Pigeon stretch')]]] },
      { day: 'Sat', date: 'Jan 16', title: 'Long run', blocks: [['Long run', 83, [P('83 min, Zone 1'), Q('HR under 75%')]]] },
    ];
    const days = defs.map((d, di) => {
      const min = d.blocks.reduce((t, b) => t + b[1], 0);
      return {
        day: d.day, date: d.date, title: d.title,
        sub: [`${min} min`, d.status].filter(Boolean).join(' · '),
        dayColor: d.today ? C.accent : C.muted, dayWeight: d.today ? 600 : 400,
        border: di === 0 ? '0' : `1px solid ${C.line}`, padLeft: di === 0 ? '0' : '20px',
        aria: `${d.day} ${d.date}, ${d.title}`,
        blocks: d.blocks.map(([name, m, lines, hard], i) => {
          const id = `${d.day}-${i}`;
          return { name, min: String(m), lines, hard: !!hard, open: this.state.open === id, toggle: () => this.setState({ open: this.state.open === id ? null : id }) };
        }),
      };
    });
    return { strip, phases, days };
  }
}
</script>
</body>
</html>
